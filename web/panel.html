<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review panel · Consent Commons (synthetic demo)</title>
<meta name="cc-title" content="title_panel">
<meta name="description" content="The community review panel approves or rejects data requests: 3 of 5 votes, 2 from community seats. Synthetic demo.">
<link rel="stylesheet" href="/css/app.css"><link rel="icon" href="/favicon.svg">
</head>
<body>
<!--CHROME:panel-->
<main class="wrap hub" data-hub="panel">
  <h1 class="page-title" data-i18n="hub_pan_h">Review panel</h1>
  <div class="tiles">
  <a class="tile role-panel" href="/review.html#requests"><span class="ic" aria-hidden="true"><span class="shape"></span></span><span><b data-i18n="hub_pan_req_h"></b><p data-i18n="hub_pan_req_p"></p></span><span class="tag role-panel count" id="wait-count" hidden></span><span class="go" aria-hidden="true">›</span></a>
  <a class="tile role-panel" href="/review.html#releases"><span class="ic" aria-hidden="true"><span class="shape"></span></span><span><b data-i18n="hub_pan_rel_h"></b><p data-i18n="hub_pan_rel_p"></p></span><span class="go" aria-hidden="true">›</span></a>
  <a class="tile role-panel" href="/review.html#pool"><span class="ic" aria-hidden="true"><span class="shape"></span></span><span><b data-i18n="hub_pan_pool_h"></b><p data-i18n="hub_pan_pool_p"></p></span><span class="go" aria-hidden="true">›</span></a>
  <a class="tile role-panel" href="/review.html#rules"><span class="ic" aria-hidden="true"><span class="shape"></span></span><span><b data-i18n="hub_pan_rules_h"></b><p id="rules-line"></p></span><span class="go" aria-hidden="true">›</span></a>
  <a class="tile role-audit" href="/ledger.html?from=panel"><span class="ic" aria-hidden="true"><span class="shape"></span></span><span><b data-i18n="hub_pan_ledger_h"></b><p data-i18n="hub_pan_ledger_p"></p></span><span class="go" aria-hidden="true">›</span></a>
  </div>
  <p class="small muted" data-i18n="rv_acting"></p>
</main>
<script type="module" src="/js/hub.js"></script>
</body>
</html>
